name: GentleWalk
options:
  bundleIdPrefix: com.kmd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GentleWalkCore:
    path: Packages/GentleWalkCore
  # Purchase layer (owner 09/10/2026). Pinned exactly: Package.resolved lives in the generated,
  # uncommitted project, so a range would float between machines.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.94.0
targets:
  GentleWalk:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - GentleWalk.storekit
          # Pose data written by tools/video (loop and form checks); the app never reads it.
          - "**/*.npz"
    dependencies:
      - package: GentleWalkCore
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmd.gentlewalk
        PRODUCT_NAME: GentleWalk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/GentleWalk.entitlements
        # Colour roles are read by name through Palette; generated symbols would clash with Color.primary.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        # Placeholder icon from scripts/make_placeholder_icon.swift until the designed icon arrives.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Screenshot persona and debug-only resources never ship (capture hook is #if DEBUG).
          EXCLUDED_SOURCE_FILE_NAMES: en-US.json
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Good Footing
        UILaunchScreen: {}
        # RevenueCat public SDK key from Config/Local.xcconfig (REVENUECAT_PUBLIC_KEY); empty → no store.
        RevenueCatPublicKey: $(REVENUECAT_PUBLIC_KEY)
        NSHealthShareUsageDescription: Good Footing reads your step count to show your everyday activity in Progress and to suggest a lighter session on busy days.
        NSHealthUpdateUsageDescription: Good Footing saves your walks and exercise sessions to Apple Health.
        NSMotionUsageDescription: Good Footing uses motion to count your sit-to-stands while your phone is held to your chest, and to measure outdoor walks without location.
        NSLocationWhenInUseUsageDescription: Good Footing uses your location only during outdoor walks to measure distance and draw your route. It stays on this phone.
        UIBackgroundModes:
          - audio
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  GentleWalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GentleWalkTests
      - path: App/GentleWalk.storekit
        buildPhase: resources
    dependencies:
      - target: GentleWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmd.gentlewalk.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GentleWalk:
    build:
      targets:
        GentleWalk: all
        GentleWalkTests: [test]
    run:
      storeKitConfiguration: App/GentleWalk.storekit
    test:
      targets:
        - GentleWalkTests
      gatherCoverageData: false
      # Formatted numbers and dates in tests follow en-US, whatever the Mac's region is.
      language: en
      region: US
