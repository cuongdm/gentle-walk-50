name: GentleWalk
options:
  bundleIdPrefix: com.kmd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GentleWalkCore:
    path: Packages/GentleWalkCore
targets:
  GentleWalk:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - GentleWalk.storekit
    dependencies:
      - package: GentleWalkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmd.gentlewalk
        PRODUCT_NAME: GentleWalk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/GentleWalk.entitlements
        # Colour roles are read by name through Palette; generated symbols would clash with Color.primary.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: primary
        # No app icon yet (icon art is a release task); set to AppIcon when the icon set lands.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Release:
          # Screenshot persona and debug-only resources never ship (capture hook is #if DEBUG).
          EXCLUDED_SOURCE_FILE_NAMES: en-US.json
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gentle Walk
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Gentle Walk reads your step count to show your everyday activity in Progress.
        NSHealthUpdateUsageDescription: Gentle Walk saves your walks and exercise sessions to Apple Health.
        NSMotionUsageDescription: Gentle Walk uses motion to count your sit-to-stands while your phone is held to your chest, and to measure outdoor walks without location.
        NSLocationWhenInUseUsageDescription: Gentle Walk uses your location only during outdoor walks to measure distance and draw your route. It stays on this phone.
        UIBackgroundModes:
          - audio
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  GentleWalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GentleWalkTests
      - path: App/GentleWalk.storekit
        buildPhase: resources
    dependencies:
      - target: GentleWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmd.gentlewalk.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GentleWalk:
    build:
      targets:
        GentleWalk: all
        GentleWalkTests: [test]
    run:
      storeKitConfiguration: App/GentleWalk.storekit
    test:
      targets:
        - GentleWalkTests
      gatherCoverageData: false
